name: GLMS Enterprise DevOps Cloud Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-containerize:
    runs-on: ubuntu-latest

    services:
      sql-server-db:
        image: ://microsoft.com
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Secure_Password123!"
        ports:
          - 1433:1433

    steps:
    - name: Checkout Source Code Repository
      uses: actions/checkout@v4

    # Enforces the Node24 platform target directly to clear all pipeline layout warnings
    - name: Configure .NET 8 SDK Environment
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Auto-locates whatever your solution file name is spelled like to prevent path rejection bugs
    - name: Restore NuGet Application Packages
      run: dotnet restore *.sln

    - name: Compile Solution Code Layers
      run: dotnet build *.sln -c Release

    - name: Run Automated API Integration Tests
      run: dotnet test *.Tests/*.csproj -c Release --no-build

    - name: Orchestrate Ecosystem with Clean Docker Compose Execution
      run: |
        docker compose build --no-cache
        docker compose up -d
        docker ps
